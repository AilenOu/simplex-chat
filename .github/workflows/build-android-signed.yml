name: 构建并签署Android APK

on:
  push:
    branches:
      - master
      - stable
    tags:
      - "v*"
      - "!*-fdroid"
      - "!*-armv7a"
    paths:
      - 'apps/multiplatform/**'
      - '.github/workflows/build-android-signed.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: 17
  GRADLE_VERSION: 8.7
  NDK_VERSION: 26.1.10909125

jobs:
  build-and-sign-apk:
    name: 构建并签署APK - ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            abi_name: arm64
          - arch: armeabi-v7a
            abi_name: armv7
          - arch: x86_64
            abi_name: x86_64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Java环境
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: 设置Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: ${{ env.NDK_VERSION }}

      - name: 验证gradle权限
        working-directory: apps/multiplatform
        run: chmod +x gradlew

      - name: 配置本地构建属性
        working-directory: apps/multiplatform
        run: |
          cat > local.properties << EOF
          abi_filter=${{ matrix.arch }}
          compression.level=9
          EOF

      - name: 准备签署密钥（仅限Release标签）
        if: startsWith(github.ref, 'refs/tags/v') && secrets.SIMPLEX_ANDROID_KEYSTORE_BASE64 != ''
        working-directory: apps/multiplatform
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIMPLEX_ANDROID_KEY_ALIAS || 'simplex-release' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIMPLEX_ANDROID_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIMPLEX_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.SIMPLEX_ANDROID_KEYSTORE_BASE64 }}" | base64 -d > signing.jks
          
          cat >> local.properties << EOF
          RELEASE_STORE_FILE=$(pwd)/signing.jks
          RELEASE_STORE_PASSWORD=$SIGNING_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$SIGNING_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD
          EOF

      - name: 构建APK
        working-directory: apps/multiplatform
        run: |
          build_type="debug"
          if [[ "${{ github.ref }}" == refs/tags/v* ]] && [[ "${{ secrets.SIMPLEX_ANDROID_KEYSTORE_BASE64 }}" != "" ]]; then
            build_type="release"
          fi
          
          ./gradlew assemble$(echo "$build_type" | sed 's/./\U&/') \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --stacktrace

      - name: 清理敏感文件
        working-directory: apps/multiplatform
        if: always()
        run: |
          rm -f signing.jks local.properties.bak

      - name: 查找生成的APK
        id: find_apk
        working-directory: apps/multiplatform
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]] && [[ "${{ secrets.SIMPLEX_ANDROID_KEYSTORE_BASE64 }}" != "" ]]; then
            apk=$(find . -name "*release.apk" -type f | head -1)
            build_type="release"
          else
            apk=$(find . -name "*debug.apk" -type f | head -1)
            build_type="debug"
          fi
          
          if [ -z "$apk" ]; then
            echo "❌ 找不到APK文件"
            find . -name "*.apk" -type f
            exit 1
          fi
          
          echo "apk_path=$apk" >> $GITHUB_OUTPUT
          echo "build_type=$build_type" >> $GITHUB_OUTPUT
          echo "✅ 找到APK: $apk"

      - name: 获取APK信息
        id: apk_info
        working-directory: apps/multiplatform
        run: |
          apk_size=$(ls -lh "${{ steps.find_apk.outputs.apk_path }}" | awk '{print $5}')
          apk_hash=$(sha256sum "${{ steps.find_apk.outputs.apk_path }}" | cut -d' ' -f1)
          
          echo "apk_size=$apk_size" >> $GITHUB_OUTPUT
          echo "apk_hash=$apk_hash" >> $GITHUB_OUTPUT
          
          echo "📦 APK大小: $apk_size"
          echo "🔐 SHA256: $apk_hash"

      - name: 上传APK到构件库
        uses: actions/upload-artifact@v4
        with:
          name: simplex-chat-${{ steps.find_apk.outputs.build_type }}-${{ matrix.abi_name }}
          path: apps/multiplatform/${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: 生成构建摘要
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 📱 Android APK 构建完成
          
          ## 构建信息
          - **架构**: ${{ matrix.arch }}
          - **构建类型**: ${{ steps.find_apk.outputs.build_type }}
          - **APK大小**: ${{ steps.apk_info.outputs.apk_size }}
          - **SHA256**: \`${{ steps.apk_info.outputs.apk_hash }}\`
          - **提交**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          
          ## 下载
          APK文件已上传到GitHub Actions构件库，保留30天。
          EOF

  create-release:
    name: 创建GitHub Release
    needs: build-and-sign-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有构件
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 准备Release文件
        id: prepare
        run: |
          mkdir -p release
          
          # 复制所有APK文件
          find artifacts -name "*.apk" -exec cp {} release/ \;
          
          # 生成校验和
          cd release
          sha256sum *.apk > SHA256SUMS.txt
          
          # 列出文件
          echo "📦 Release文件:"
          ls -lh
          
          echo "files_count=$(ls -1 *.apk | wc -l)" >> $GITHUB_OUTPUT

      - name: 提取版本信息
        id: version
        run: |
          version="${{ github.ref }}"
          version=${version#refs/tags/v}
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: 生成Release说明
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          # SimpleX Chat Android v${{ steps.version.outputs.version }}
          
          ## 下载
          
          本次发布包含以下构建版本：
          
          - **arm64-v8a**: 最新的Android设备（推荐）
          - **armeabi-v7a**: 较旧的Android设备支持
          - **x86_64**: Android模拟器和x86设备
          
          ## 验证完整性
          
          下载后可使用以下命令验证APK文件的完整性：
          
          ```bash
          sha256sum -c SHA256SUMS.txt
          ```
          
          ## 安装说明
          
          ```bash
          adb install simplex-chat-release-arm64.apk
          ```
          
          ## 更新日志
          
          详见 [CHANGELOG.md](https://github.com/simplex-chat/simplex-chat/blob/stable/docs/version-changes)
          
          ## 安全信息
          
          - 所有APK都已使用官方签署密钥签署
          - 支持APK签名方案 v2 和 v3
          - 可通过 F-Droid 或官方渠道验证
          EOF

      - name: 上传到Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          body_path: release_notes.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布成功通知
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # ✅ Release 发布成功
          
          ## 版本信息
          - **版本**: v${{ steps.version.outputs.version }}
          - **APK数量**: ${{ steps.prepare.outputs.files_count }}
          - **时间**: $(date '+%Y-%m-%d %H:%M:%S UTC')
          
          ## 下载链接
          https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}
          EOF

