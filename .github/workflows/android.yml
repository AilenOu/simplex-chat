name: Build Simplex Chat Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libgmp-dev zlib1g-dev git curl

      - name: Install Haskell
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://get.haskellstack.org/ | sh

      - name: Build native libraries for Android
        run: |
          cd apps/multiplatform
          make android

      - name: Build APK
        run: |
          cd apps/multiplatform
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimplexChat-AutoVideo
          path: apps/multiplatform/android/build/outputs/apk/release/*.apk
