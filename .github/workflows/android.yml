name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup environment
        run: |
          sudo apt update
          sudo apt install -y haskell-stack ghc cabal-install libgmp3-dev zlib1g-dev libssl-dev

      - name: Build core libraries
        run: |
          cd apps/multiplatform
          make android

      - name: Build APK
        run: |
          cd apps/multiplatform
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimplexChat-AutoVideo
          path: apps/multiplatform/android/build/outputs/apk/release/*.apk
